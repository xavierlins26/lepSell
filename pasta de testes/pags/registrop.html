<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>LepSell - Registrar Produto</title>
  <link rel="stylesheet" href="../css/registro.css">
</head>
<body>

  <a href="../index.html" class="voltar-icone">
    <img src="../img/seta_icon.png" alt="Voltar" style="width:32px; height:32px;">
  </a>


  <header class="cabecalho">
    <h2>LepSell - Registrar Produto</h2>
  </header>

  <div class="container">

    <section class="nota">
      <h1 class="nt">Registrar Produto</h1>
      <hr class="tiny-line">

      <form class="formulario">
        <label for="nome">Nome do Produto:</label>
        <input type="text" id="nome" placeholder="Nome do Produto" required>

        <label for="preco">Preço:</label>
        <input type="number" id="preco" step="0.01" placeholder="Preço" required>

        <label for="quantidade">Quantidade:</label>
        <input type="number" id="estoque" placeholder="Quantidade" required>

        <label for="descricao">Descrição:</label>
        <textarea id="descricao" rows="3" placeholder="Detalhes do produto"></textarea>

        <label class="checkbox" for="promocao"> Código Promocional <input  type="checkbox" id="promocao" placeholder="Promoção"> </label>
        

        <div id="campo-codigo" style="display: none;">
          <label for="codigo">Digite o código:</label>
          <input type="text" id="codigo" placeholder="Ex: PROMO10">
        </div>

        <div class="rgst_ctgr">
          <label class="ctgr" for="ctgr">
            <ul><li class="list"><input type="radio" id="ctgr" value="Roupa"> <strong>Roupa</strong></li></ul>
          </label>
          
          <label class="ctgr" for="ctgr"> 
            <ul><li class="list"><input type="radio" id="ctgr" value="Alimento"> <strong>Alimento</strong></li></ul>
          </label>
          <label class="ctgr" for="ctgr">
            <ul><li class="list"><input type="radio" id="ctgr" value="Maquiagem"> <strong>Maquiagens</strong></li></ul>
          </label>
        </div>

        <span class="hide" id="categoriaSelecionada"></span>

        <div class="botoes">
          <button type="submit" class="botao"><span class="box"></span>Salvar Produto</button>
          <a href="./estoque.html">
            <button type="button" class="botao"><span class="box"></span>Voltar ao Estoque</button>
          </a>
        </div>
      </form>
    </section>

  </div>

  <footer>
    <p>&copy; 2025 LepSell. Todos os direitos reservados.</p>
  </footer>

  <script src="../js/estoque.js"></script>
</body>
</html>
